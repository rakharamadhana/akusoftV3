<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Akusoft v2.0</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "inverse-on-surface": "#eff1f3",

                        "primary-container": "#2563eb",
                        "on-secondary-fixed-variant": "#005236",
                        "pill-indigo-bg": "#E0E7FF",
                        "secondary": "#006c49",

                        "tertiary-fixed-dim": "#c0c1ff",
                        "pill-amber-bg": "#FEF3C7",
                        "on-surface": "#191c1e",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#eeefff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "secondary-container": "#6cf8bb",
                        "on-tertiary": "#ffffff",
                        "background": "#f7f9fb",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#00714d",
                        "on-surface-variant": "#434655",

                    "borderRadius": {

<style>
        body {
            background-color: #F8FAFC;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .micro-shadow {
            box-shadow: 0px 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .input-focus-ring:focus {
            outline: none;
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-gutter">
<!-- Login Container -->
<main class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-stack-lg text-center">
<div class="w-12 h-12 bg-primary-container rounded-xl flex items-center justify-center mb-4 micro-shadow">
<span class="material-symbols-outlined text-white text-[28px]" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-headline-md text-headline-md text-slate-heading">Akusoft v2.0</h1>
<p class="font-body-md text-body-md text-slate-body mt-1">Financial Administration Reimagined</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-border-light rounded-xl p-8 micro-shadow">
<div class="mb-stack-lg">
<h2 class="font-headline-sm text-headline-sm text-slate-heading">Welcome back</h2>
<p class="font-body-sm text-body-sm text-slate-body">Enter your credentials to access your dashboard</p>
</div>
<form class="space-y-stack-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-slate-heading" for="email">Email Address</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-border-light rounded-lg font-body-md text-body-md text-slate-heading input-focus-ring transition-all duration-200" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-slate-heading" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-border-light rounded-lg font-body-md text-body-md text-slate-heading input-focus-ring transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary-container hover:bg-primary text-white font-label-md text-[14px] py-3.5 rounded-lg micro-shadow transition-all duration-200 active:scale-[0.98]" type="submit">
                    Sign in
                </button>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-border-light"></div>
<span class="flex-shrink mx-4 font-label-md text-label-md text-slate-body">or continue with</span>
<div class="flex-grow border-t border-border-light"></div>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest border border-border-light hover:bg-surface-container-low text-slate-heading font-label-md text-[14px] py-3.5 rounded-lg transition-all duration-200 active:scale-[0.98]" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Sign in with Google
                </button>
</form>
</div>
<!-- Footer Action -->
<p class="text-center mt-stack-lg font-body-md text-body-md text-slate-body">
            New to Akusoft? 
            <a class="text-primary font-bold hover:underline transition-all" href="#">Register your company</a>
</p>
<!-- Trust Badge / Decorative element -->
<div class="mt-12 flex justify-center items-center gap-6 opacity-40 grayscale">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]" data-icon="lock">lock</span>
<span class="font-label-md text-[10px] uppercase tracking-widest">Secure 256-bit SSL</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]" data-icon="verified_user">verified_user</span>
<span class="font-label-md text-[10px] uppercase tracking-widest">GDPR Compliant</span>
</div>
</div>
</main>
<!-- Background Decoration (Optional Subtle Atmospheric Effect) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[35%] h-[35%] rounded-full bg-secondary/5 blur-[100px]"></div>
</div>
<script>
        // Micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('.bg-surface-container-lowest').classList.add('ring-1', 'ring-primary/10');
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('.bg-surface-container-lowest').classList.remove('ring-1', 'ring-primary/10');
            });
        });

        // Simple button active state simulation for visual feedback
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('mousedown', () => btn.style.transform = 'scale(0.97)');
            btn.addEventListener('mouseup', () => btn.style.transform = 'scale(1)');
            btn.addEventListener('mouseleave', () => btn.style.transform = 'scale(1)');
        });
    </script>
</body></html>
